<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoMind · 实验台</title>
<style>
:root{color-scheme:dark;--bg:#101316;--panel:#191d22;--line:#30363e;--text:#f0f2f5;--muted:#a3adb8;--accent:#b9ed88;--danger:#ffb0a8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Noto Sans SC",sans-serif}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer;background:#252b32;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 15px}button:hover{background:#343d47}button:disabled{opacity:.4;cursor:not-allowed}button.primary{background:var(--accent);border-color:var(--accent);color:#162015}button.danger{color:var(--danger);border-color:#784a49}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}header{height:80px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4vw;gap:20px}.brand{font-size:24px;font-weight:750;letter-spacing:-1px}.brand span{color:var(--accent)}.subbrand{font-size:14px;color:var(--muted);margin-left:16px;letter-spacing:0}.status{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}main{max-width:1600px;margin:auto;padding:32px 4vw 60px}nav{display:flex;gap:10px;border-bottom:1px solid var(--line);margin-bottom:28px;overflow:auto}nav button{white-space:nowrap;background:transparent;border:0;border-radius:0;padding:10px 19px 16px;color:var(--muted)}nav button.active{color:var(--accent);border-bottom:2px solid var(--accent)}h1{font-size:32px;line-height:1.25;letter-spacing:-.6px;margin:0 0 10px}h2{font-size:20px;margin:0}h3{font-size:16px;margin:0}.muted{color:var(--muted)}.intro{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px}.stat{border:1px solid var(--line);padding:18px 22px;border-radius:10px}.stat b{display:block;font-size:32px;font-weight:600;line-height:1.4}.stat span{color:var(--muted);font-size:13px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.panelhead{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;gap:16px}.video{width:100%;aspect-ratio:16/9;display:block;background:#07090b}.detail{padding:22px}.detail .row{margin-bottom:12px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.badge{display:inline-block;border:1px solid var(--line);padding:3px 9px;border-radius:5px;font-size:12px;color:var(--muted)}.ok{color:var(--accent);border-color:#41543b}.bad{color:var(--danger)}.timeline{padding:0 22px 15px}.event{padding:16px 0;border-top:1px solid var(--line);word-break:break-word;font-size:13px}.event time{display:block;color:var(--muted);font-size:12px;margin-top:6px}.runlist{display:grid;gap:12px}.run{border:1px solid var(--line);padding:18px 20px;border-radius:10px;background:var(--panel);display:flex;justify-content:space-between;align-items:center;gap:20px}.run h3{overflow-wrap:anywhere}.run p{margin:6px 0 0;color:var(--muted);font-size:13px}.runActions{display:flex;gap:8px;flex-shrink:0}.toolbar{display:flex;gap:12px;margin:0 0 20px;flex-wrap:wrap}input,select{background:#20252c;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:10px 12px}input{min-width:250px}select{max-width:100%}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}.card{padding:22px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.card h3{overflow-wrap:anywhere}.card p{color:var(--muted);margin:8px 0;font-size:13px}.empty{padding:60px 25px;text-align:center;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}.notice{border:1px solid #625b3d;background:#29271e;padding:12px 18px;border-radius:8px;margin:0 0 20px;color:#ecdbad;font-size:13px}.error{background:#382526;color:#ffc9c3;border-color:#79534e}.hidden{display:none!important}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;max-width:660px;width:calc(100% - 32px);padding:28px;max-height:88vh;overflow:auto}dialog::backdrop{background:#000b;backdrop-filter:blur(5px)}dialog h2{margin-bottom:15px}dialog p{font-size:14px;color:var(--muted)}dialog input{width:100%;margin:10px 0 20px}pre{white-space:pre-wrap;word-break:break-all;background:#101316;border-radius:7px;padding:14px;font:12px/1.7 monospace;max-height:220px;overflow:auto}.dialogFooter{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.sectiontitle{margin:30px 0 16px}.footer{color:var(--muted);font-size:12px;margin-top:35px}.case-select{width:100%}.toast{position:fixed;bottom:25px;right:25px;background:#33432a;color:#ddf5ce;padding:14px 22px;border-radius:9px;box-shadow:0 8px 30px #0008;max-width:85vw;z-index:5}small{font-size:12px}details summary{cursor:pointer;color:var(--muted);font-size:13px}.instruction{font-size:16px;line-height:1.7;color:#e4e9ef;margin:12px 0 20px}#runDetail{margin-bottom:25px}@media(max-width:900px){.workspace{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.subbrand{display:none}.run{align-items:flex-start;flex-direction:column}.intro{flex-direction:column}header{padding:0 20px}.status>span{display:none}main{padding:24px 20px}.runActions{flex-wrap:wrap}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
.workspace>*{min-width:0}.panelhead h2{overflow-wrap:anywhere}.panelhead>div{min-width:0}.stat b{font-size:clamp(24px,3vw,32px)}@media(max-width:900px){.workspace{grid-template-columns:minmax(0,1fr)}.panelhead{flex-wrap:wrap}.stat{padding:16px}.stat b{white-space:nowrap}.runActions{width:100%}.status{flex-shrink:0}}
</style></head>
<body><header><div class="brand">Geo<span>Mind</span><span class="subbrand">实验台</span></div><div class="status"><i class="dot" id="liveDot"></i><span id="syncStatus">正在读取本地结果</span><button id="refresh">刷新</button></div></header>
<main><nav aria-label="主导航"><button data-tab="overview" class="active">总览</button><button data-tab="runs">测试与视频</button><button data-tab="tasks">任务与场景</button><button data-tab="changes">更新记录</button><button data-tab="storage">数据清理</button></nav>
<div id="errors"></div><section id="overview"></section><section id="runs" class="hidden"></section><section id="tasks" class="hidden"></section><section id="changes" class="hidden"></section><section id="storage" class="hidden"></section>
<div class="footer">本地目录实时索引 · 每 15 秒检查更新 · 配置与源码不在清理范围内</div></main>
<dialog id="cleanup"><h2>确认清理测试产物</h2><div id="cleanupContent"></div><label for="confirmation">输入目录名，确认永久删除</label><input id="confirmation" autocomplete="off" spellcheck="false"><div id="cleanupError" role="alert"></div><div class="dialogFooter"><button id="cancelCleanup">保留数据</button><button id="confirmCleanup" class="danger" disabled>确认删除</button></div></dialog>
<div id="toast" class="toast hidden" role="status"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{if(!n)return '0 B';const k=Math.min(Math.floor(Math.log(n)/Math.log(1024)),3);return (n/1024**k).toFixed(k?1:0)+' '+['B','KB','MB','GB'][k]}, date=v=>new Date(v).toLocaleString('zh-CN',{hour12:false});
let state=null, tab='overview', selected=null, caseId=null, stream='observer', plan=null, signature='', loading=false;
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),5000)}
function label(r){return r.deleted?'已清理':r.missing?'文件不在本机':r.verified?'验证通过':r.failure?'执行失败':'尚未验证'}
function badge(r){return `<span class="badge ${r.verified&&!r.deleted&&!r.missing?'ok':''}">${label(r)}</span>`}
function events(items){return items.map(e=>`<div class="event">${esc(e.title)}<time>${date(e.at)}</time></div>`).join('')||'<p class="muted">暂无更新</p>'}
function runRows(items,cleanup=false){return items.map(r=>`<article class="run"><div><div class="row"><h3>${esc(r.id)}</h3>${badge(r)}</div><p>${date(r.at)} · ${r.passed}/${r.positive} 正例通过 · ${r.video_count} 段原始视频${r.deleted?'（已删除）':''} · ${fmt(r.bytes)}</p></div><div class="runActions"><button data-run="${esc(r.id)}">查看结果</button>${cleanup&&!r.deleted&&!r.missing?`<button class="danger" data-clean="${esc(r.id)}">预览清理</button>`:''}</div></article>`).join('')||'<div class="empty">还没有测试结果。运行产生 report.json 后会自动出现在这里。</div>'}
function viewer(r){if(!r)return '<div class="empty">暂无可展示的测试记录</div>';const cases=r.cases||[];let c=cases.find(c=>c.id===caseId)||cases[0];if(c)caseId=c.id;const src=c?.[stream];return `<div class="panel"><div class="panelhead"><div><h2>${esc(r.id)}</h2><small class="muted">${date(r.at)} · ${esc(r.policy)}</small></div>${badge(r)}</div>${src?`<video class="video" controls playsinline preload="metadata" ${c.poster?`poster="${esc(c.poster)}"`:''} src="${esc(src)}"></video>`:`<div class="empty">${r.deleted?'视频和原始数据已按确认清理，验证摘要保留。':'此条记录没有可播放的视频。'}</div>`}<div class="detail">${cases.length?`<div class="row"><select class="case-select" id="caseSelect" aria-label="选择测试实例">${cases.map(x=>`<option value="${esc(x.id)}" ${x.id===c.id?'selected':''}>${esc(x.id)}${x.negative?' · 负例':''} · ${x.verified?'验证通过':'未通过'}</option>`).join('')}</select></div><div class="row"><button data-stream="observer" class="${stream==='observer'?'primary':''}">完整过程</button><button data-stream="agent" class="${stream==='agent'?'primary':''}">Agent 视角</button><span class="badge ok">任务版本 ${esc(c.release_version||'未标注')}</span><span class="badge">${esc(c.scene)}</span><span class="badge">${esc(c.error_label||'TCP 误差')} ${c.error_mm.toFixed(2)} mm</span></div><p class="muted">${(c.objects||[]).length?'物体资产：'+c.objects.map(a=>esc(({blue_can:'咖啡罐',cube_can:'肉罐',yellow_bottle:'黄色芥末瓶'})[a]||a)).join('、'):''}</p><div class="row">${(c.camera_videos||[]).filter(v=>v.url).map(v=>`<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.name)}</a>`).join(' · ')}</div><div class="instruction"><small class="muted">中文指令</small><p>${esc(c.instruction_zh||'此指令暂无中文翻译，请参阅下方英文原文。')}</p><small class="muted">英文原文</small><p lang="en">${esc(c.instruction)}</p></div><p class="muted"><small>${stream==='observer'?'完整过程包含记忆任务的隐藏干预，仅供检查。':'Agent 视角会将记忆隐藏阶段遮黑。'} 执行策略：${esc(r.policy)}。结果不代表模型视觉推理能力。</small></p>`:''}${r.failure?`<div class="notice error">${esc(typeof r.failure==='string'?r.failure:JSON.stringify(r.failure))}</div>`:''}${r.report?`<a href="${esc(r.report)}" target="_blank" rel="noopener">查看完整报告 JSON</a>`:''}</div></div>`}
function renderOverview(){const cfg=state.config,active=state.runs.filter(r=>!r.deleted&&!r.missing),latest=active.find(r=>r.verified&&r.cases.some(c=>c.observer))||active[0]||state.runs[0];$('#overview').innerHTML=`<div class="intro"><div><h1>进展，在这里汇总。</h1><div class="muted">查看当前配置、最新执行与实际仿真画面。</div></div><span class="badge">数据来自本地项目</span></div><div class="stats"><div class="stat"><b>${cfg.task_definitions.length}</b><span>注册任务定义</span></div><div class="stat"><b>${cfg.episodes.length}</b><span>原生任务实例</span></div><div class="stat"><b>${active.length}</b><span>本地测试批次</span></div><div class="stat"><b>${fmt(active.reduce((n,r)=>n+r.bytes,0))}</b><span>测试数据与打包文件</span></div></div><div class="workspace"><div>${viewer(latest)}</div><aside class="panel"><div class="panelhead"><h2>最近更新</h2></div><div class="timeline">${events(state.changes.slice(0,7))}</div></aside></div>`}
function renderRuns(){const r=state.runs.find(r=>r.id===selected);$('#runs').innerHTML=`<div class="intro"><div><h1>测试与视频</h1><div class="muted">每个批次独立保留，旧结果不会被当作最新结果。</div></div></div><div id="runDetail">${r?viewer(r):''}</div><div class="runlist">${runRows(state.runs)}</div>`}
function renderTasks(){const q=$('#searchTasks')?.value||'';$('#tasks').innerHTML=`<div class="intro"><div><h1>任务与场景</h1><div class="muted">注册不等于已实现；执行状态来自实际测试记录。</div></div></div><div class="toolbar"><input id="searchTasks" aria-label="搜索任务" placeholder="搜索任务、领域或任务族" value="${esc(q)}"></div><div class="cards" id="taskCards"></div><h2 class="sectiontitle">原生任务使用的场景</h2><div class="cards">${state.config.scenes.filter(s=>state.config.episodes.some(e=>e.scene_id===s.scene_id)).map(s=>`<article class="card"><h3>${esc(s.scene_id)}</h3><p>${esc(s.physics?.scene_mode||'未配置物理场景')}</p><p>${esc(s.usd_path||s.usd_hint)}</p><span class="badge">${state.config.episodes.filter(e=>e.scene_id===s.scene_id).length} 个实例引用</span></article>`).join('')}</div>`;filterTasks(q)}
function filterTasks(q){q=q.toLowerCase();$('#taskCards').innerHTML=state.config.task_definitions.filter(t=>[t.task_id,t.domain,t.family].join(' ').toLowerCase().includes(q)).map(t=>{const eps=state.config.episodes.filter(e=>e.task_id===t.task_id),cases=state.runs.flatMap(r=>r.cases).filter(c=>c.task===t.task_id&&!c.negative),pass=cases.some(c=>c.verified);return `<article class="card"><div class="row"><span class="badge">${t.domain==='SpatialMemory'?'空间记忆':'空间推理'}</span>${pass?'<span class="badge ok">有物理验证记录</span>':'<span class="badge">暂无本页验证记录</span>'}</div><h3>${esc(t.task_id)}</h3><div class="row">${[...(state.config.tasks||[]),...(state.config.vla_tasks||[])].some(e=>e.task_id===t.task_id)?'<span class="badge">原注册 1.0</span>':''}${eps.length?'<span class="badge ok">新增实例 2.0</span>':''}</div><p>${esc(t.family)} · ${eps.length} 个原生实例</p>${eps.length?`<p>${eps.map(e=>esc(e.episode_id)+' · '+esc(e.release_version||'2.0')).join('<br>')}</p>`:''}</article>`}).join('')||'<div class="empty">没有匹配的任务</div>'}
function renderStorage(){$('#storage').innerHTML=`<div class="intro"><div><h1>数据清理</h1><div class="muted">先预览文件清单，再输入目录名确认。不会自动删除。</div></div></div><div class="notice">清理范围：选定测试目录中的视频、轨迹、证据、配置副本及其 ZIP 和校验文件。保留项目源码、正式配置与精简验证摘要。正在生成的结果不应清理。</div><div class="runlist">${runRows(state.runs,true)}</div>`}
function render(){if(!state)return;$('#errors').innerHTML=state.errors.map(e=>`<div class="notice error">${esc(e)}</div>`).join('');if(tab==='overview')renderOverview();if(tab==='runs')renderRuns();if(tab==='tasks')renderTasks();if(tab==='storage')renderStorage();if(tab==='changes')$('#changes').innerHTML=`<div class="intro"><div><h1>更新记录</h1><div class="muted">从首次启动开始记录配置变化、新结果与确认清理操作。</div></div></div><div class="panel"><div class="timeline">${events(state.changes)}</div></div>`}
function showTab(name){tab=name;history.replaceState(null,'','#'+name);for(const e of document.querySelectorAll('main>section'))e.classList.toggle('hidden',e.id!==tab);for(const b of document.querySelectorAll('nav button'))b.classList.toggle('active',b.dataset.tab===tab);render()}
async function refresh(force=false){if(loading)return;loading=true;try{const response=await fetch('/api/state');if(!response.ok)throw Error('服务器读取失败');const next=await response.json();const sig=JSON.stringify([next.config,next.runs,next.changes,next.errors]);state=next;$('#syncStatus').textContent='已同步 '+new Date().toLocaleTimeString('zh-CN');$('#liveDot').style.background='var(--accent)';if(sig!==signature||force){const playing=document.querySelector('section:not(.hidden) video');if(!force&&playing&&!playing.paused){toast('发现更新，播放结束后刷新可查看')}else{signature=sig;render()}}}catch(e){$('#syncStatus').textContent='连接中断，请刷新';$('#liveDot').style.background='var(--danger)';toast(e.message)}finally{loading=false}}
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':state.csrf},body:JSON.stringify(body)});const v=await r.json();if(!r.ok)throw Error(v.error);return v}
async function preview(id){try{plan=await post('/api/cleanup/plan',{id});$('#cleanupContent').innerHTML=`<p>将永久删除 <strong>${plan.file_count}</strong> 个文件，释放约 <strong>${fmt(plan.bytes)}</strong>。此操作不可撤销。</p><pre>${plan.targets.map(esc).join('\n')}</pre><details><summary>展开完整文件清单</summary><pre>${plan.files.map(esc).join('\n')}</pre></details><p>保留精简验证摘要；视频与原始数据不保留。请输入：<strong>${esc(plan.id)}</strong></p>`;$('#confirmation').value='';$('#confirmCleanup').disabled=true;$('#cleanupError').textContent='';$('#cleanup').showModal();$('#confirmation').focus()}catch(e){toast(e.message)}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab)showTab(b.dataset.tab);if(b.dataset.run){selected=b.dataset.run;caseId=null;showTab('runs');window.scrollTo({top:0,behavior:'smooth'})}if(b.dataset.clean)preview(b.dataset.clean);if(b.dataset.stream){stream=b.dataset.stream;render()}});
document.addEventListener('change',e=>{if(e.target.id==='caseSelect'){caseId=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='searchTasks')filterTasks(e.target.value);if(e.target.id==='confirmation')$('#confirmCleanup').disabled=e.target.value!==plan?.id});
$('#refresh').onclick=()=>refresh(true);$('#cancelCleanup').onclick=()=>$('#cleanup').close();$('#confirmCleanup').onclick=async()=>{const b=$('#confirmCleanup');b.disabled=true;try{const result=await post('/api/cleanup/confirm',{token:plan.token,confirmation:$('#confirmation').value});$('#cleanup').close();toast('已清理 '+result.deleted+'，释放 '+fmt(result.freed_bytes));await refresh(true)}catch(e){$('#cleanupError').textContent=e.message}};
showTab(['overview','runs','tasks','changes','storage'].includes(location.hash.slice(1))?location.hash.slice(1):'overview');
refresh();setInterval(()=>refresh(),15000);
</script></body></html>
